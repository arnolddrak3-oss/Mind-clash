name: mind-clasher

services:
  api:
    build:
      context: "${BASE44_PROJECT_ROOT:-.}"
      dockerfile: backend/Dockerfile
    working_dir: /app/backend
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/app"
      - contact-data:/data
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_PATH=/data/contacts.db
    env_file:
      - /run/base44/app.env
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--reload-dir", "/app/backend"]
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health',timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    image: node:22
    working_dir: /app
    volumes:
      - "${BASE44_PROJECT_ROOT:-.}:/app"
      - web-node-modules:/app/node_modules
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    environment:
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - API_PROXY_TARGET=http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 45s

volumes:
  web-node-modules:
  contact-data:
